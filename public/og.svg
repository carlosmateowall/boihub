<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d2818"/>
      <stop offset="100%" stop-color="#1a4f2e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Logo (BH) -->
  <g transform="translate(96, 96)">
    <rect width="120" height="120" rx="24" fill="#0d2818" stroke="#4ade80" stroke-width="3"/>
    <text x="60" y="84" text-anchor="middle"
          font-family="Georgia, serif" font-weight="700" font-size="60" fill="#4ade80">B</text>
    <text x="86" y="84" text-anchor="middle"
          font-family="Georgia, serif" font-weight="700" font-size="60" fill="#c8992a">H</text>
  </g>

  <!-- Headline -->
  <text x="96" y="330"
        font-family="Georgia, serif" font-weight="700" font-size="84" fill="#f7f0e0">
    BoiHub
  </text>
  <text x="96" y="400"
        font-family="Arial, sans-serif" font-weight="400" font-size="40" fill="#f7f0e0" opacity="0.9">
    O super app do pecuarista brasileiro
  </text>

  <!-- Subline -->
  <text x="96" y="500"
        font-family="Arial, sans-serif" font-weight="400" font-size="28" fill="#4ade80">
    Veterinários · Frete de gado · Revendas e insumos
  </text>

  <!-- URL no rodapé -->
  <text x="96" y="568"
        font-family="Arial, sans-serif" font-weight="600" font-size="22" fill="#c8992a">
    boihub.com.br
  </text>
</svg>
